
<div class="container-fluid">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">

    <h4 class="mb-0">
      Categories
    </h4>

    <button
      type="button"
      class="btn btn-primary"
      (click)="showForm = !showForm">
      <i class="material-icons align-middle me-1">
        add
      </i>
    </button>

  </div>


  <!-- Add Category Form -->
  <div
    class="card mb-3"
    *ngIf="showForm">

    <div class="card-header">
      <strong>Add Category</strong>
    </div>

    <div class="card-body">

      <form
        [formGroup]="categoryForm"
        (ngSubmit)="saveCategory()">

        <div class="mb-3">

          <label
            for="name"
            class="form-label">

            Category Name

          </label>

          <input
            id="name"
            type="text"
            class="form-control"
            formControlName="name"
            placeholder="Enter category name">

          <div
            class="text-danger mt-1"
            *ngIf="
              categoryForm.get('name')?.invalid &&
              categoryForm.get('name')?.touched
            ">

            Category name is required.

          </div>

        </div>


        <!-- Buttons -->
        <button
          type="submit"
          class="btn btn-success me-2"
          [disabled]="categoryForm.invalid">

          Save

        </button>

        <button
          type="button"
          class="btn btn-secondary"
          (click)="showForm = false">

          Cancel

        </button>

      </form>

    </div>

  </div>


  <!-- Category List -->
  <div class="card">

    <div class="card-header">

      <h5 class="mb-0">
        Category List
      </h5>

    </div>

    <div class="card-body">

      <table class="table table-bordered table-hover">

        <thead>

          <tr>
            <th style="width: 80px;">#</th>
            <th>Name</th>
            <th style="width: 180px;">Actions</th>
          </tr>

        </thead>

        <tbody>

          <tr
            *ngFor="
              let category of categories;
              let i = index
            ">

            <td>
              {{ i + 1 }}
            </td>

            <td>
              {{ category.name }}
            </td>

            <td>

              <button
                type="button"
                class="btn btn-sm btn-primary me-2"  (click)="editCategory(category.id)">

                <i class="material-icons align-middle">
                  edit
                </i>

              </button>

              <button
                type="button"
                class="btn btn-sm btn-danger" (click)="deleteCategory(category.id)">

                <i class="material-icons align-middle">
                  delete
                </i>
              </button>

            </td>

          </tr>


          <!-- Empty -->
          <tr
            *ngIf="categories.length === 0">

            <td
              colspan="3"
              class="text-center text-muted py-4">

              No categories found.

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

<div
  class="modal fade show"
  *ngIf="showDeleteModal"
  style="display: block;"
  tabindex="-1">

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          Delete Category
        </h5>

        <button
          type="button"
          class="btn-close"
          (click)="cancelDelete()">
        </button>

      </div>

      <div class="modal-body text-center py-4">

        <i
          class="material-icons text-danger"
          style="font-size: 48px;">

          delete_outline

        </i>

        <h5 class="mt-3">
          Are you sure?
        </h5>

        <p class="text-muted mb-0">
          This category will be permanently deleted.
        </p>

      </div>

      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-secondary"
          (click)="cancelDelete()">

          Cancel

        </button>

        <button
          type="button"
          class="btn btn-danger"
          (click)="confirmDelete()">

          Delete

        </button>

      </div>

    </div>

  </div>

</div>


<!-- Modal Backdrop -->
<div
  class="modal-backdrop fade show"
  *ngIf="showDeleteModal">
</div>
