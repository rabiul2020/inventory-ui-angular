<div class="container-fluid">

  <!-- ============================= -->
  <!-- Role List -->
  <!-- ============================= -->

  <div *ngIf="!showForm">

    <div class="d-flex justify-content-between align-items-center mb-3">

      <h4 class="mb-0">
        Roles
      </h4>

      <button
        type="button"
        class="btn btn-primary"
        (click)="openRoleForm()">

        <i class="fa fa-plus"></i>
        New Role

      </button>

    </div>


    <!-- Success Message -->
    <div
      *ngIf="successMessage"
      class="alert alert-success">

      {{ successMessage }}

    </div>


    <!-- Error Message -->
    <div
      *ngIf="errorMessage"
      class="alert alert-danger">

      {{ errorMessage }}

    </div>


    <!-- Role Table -->
    <div class="card">

      <div class="card-body p-0">

        <table
          class="table table-bordered table-hover mb-0">

          <thead>

            <tr>

              <th style="width: 70px;">
                #
              </th>

              <th>
                Role Name
              </th>

              <th
                style="width: 120px;"
                class="text-center">

                Action

              </th>

            </tr>

          </thead>


          <tbody>

            <tr
              *ngFor="
                let role of roles;
                let i = index
              ">

              <td>
                {{ i + 1 }}
              </td>

              <td>
                {{ role.name }}
              </td>

              <td class="text-center">

                <button
                  type="button"
                  class="btn btn-sm btn-outline-primary"
                  (click)="editRole(role)">

                  <i class="fa fa-edit"></i>
                  Edit

                </button>

              </td>

            </tr>


            <!-- No Role -->
            <tr
              *ngIf="roles.length === 0">

              <td
                colspan="3"
                class="text-center text-muted py-3">

                No roles found.

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>



  <!-- ============================= -->
  <!-- Create / Edit Role Form -->
  <!-- ============================= -->

  <div *ngIf="showForm">

    <div class="card">

      <!-- Header -->

      <div
        class="card-header d-flex justify-content-between align-items-center">

        <h5 class="mb-0">

          {{ editingRoleId
              ? 'Edit Role'
              : 'Create Role' }}

        </h5>

        <button
          type="button"
          class="btn-close"
          (click)="closeRoleForm()">

        </button>

      </div>


      <div class="card-body">


        <!-- Error -->

        <div
          *ngIf="errorMessage"
          class="alert alert-danger">

          {{ errorMessage }}

        </div>


        <!-- Success -->

        <div
          *ngIf="successMessage"
          class="alert alert-success">

          {{ successMessage }}

        </div>


        <!-- Role Form -->

        <form
          [formGroup]="roleForm">


          <!-- Role Name -->

          <div class="mb-4">

            <label
              for="roleName"
              class="form-label">

              Role Name

              <span class="text-danger">
                *
              </span>

            </label>


            <input
              id="roleName"
              type="text"
              class="form-control"
              formControlName="name"
              placeholder="Enter role name">


            <div
              *ngIf="
                roleForm.get('name')?.touched &&
                roleForm.get('name')?.invalid
              "
              class="text-danger mt-1">

              Role name is required.

            </div>

          </div>



          <!-- ============================= -->
          <!-- Permissions -->
          <!-- ============================= -->

          <div class="mb-3">

            <label class="form-label fw-bold">

              Permissions

            </label>


            <div class="border rounded p-3">


              <!-- Permission Modules -->

              <div
                *ngFor="
                  let module of permissionTree
                "
                class="mb-3">


                <!-- Module Header -->

                <div
                  class="d-flex align-items-center gap-2">


                  <button
                    type="button"
                    class="btn btn-sm btn-outline-secondary"
                    (click)="
                      toggleModule(module.module)
                    ">

                    {{
                      isModuleExpanded(
                        module.module
                      )
                        ? '−'
                        : '+'
                    }}

                  </button>


                  <strong>

                    {{ module.module }}

                  </strong>

                </div>



                <!-- Child Permissions -->

                <div
                  *ngIf="
                    isModuleExpanded(
                      module.module
                    )
                  "
                  class="ms-5 mt-2">


                  <div
                    *ngFor="
                      let permission
                      of module.permissions
                    "
                    class="form-check mb-2">


                    <input
                      type="checkbox"
                      class="form-check-input"
                      [id]="
                        'permission-' +
                        permission.id
                      "
                      [checked]="
                        isPermissionSelected(
                          permission.id
                        )
                      "
                      (change)="
                        onPermissionChange(
                          permission.id,
                          $event
                        )
                      ">


                    <label
                      class="form-check-label"
                      [for]="
                        'permission-' +
                        permission.id
                      ">

                      {{ permission.name }}

                    </label>

                  </div>

                </div>

              </div>


              <!-- No Permission -->

              <div
                *ngIf="
                  permissionTree.length === 0
                "
                class="text-muted text-center py-3">

                No permissions available.

              </div>

            </div>

          </div>



          <!-- ============================= -->
          <!-- Buttons -->
          <!-- ============================= -->

          <div class="mt-4">

            <button
              type="button"
              class="btn btn-primary"
              (click)="saveRole()">

              <i class="fa fa-save"></i>

              {{
                editingRoleId
                  ? 'Update'
                  : 'Save'
              }}

            </button>


            <button
              type="button"
              class="btn btn-secondary ms-2"
              (click)="closeRoleForm()">

              Cancel

            </button>

          </div>


        </form>

      </div>

    </div>

  </div>

</div>
